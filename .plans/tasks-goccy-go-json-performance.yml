  - id: task-004
    title: "Swap encoding/json imports in production files and fix type boundary in decode_test.go"
    description: |
      Replace the encoding/json import with github.com/goccy/go-json in the three production
      files: query.go, internal/api/api.go, and internal/decode/decode.go. No logic changes
      are permitted — only the import path changes. Then audit internal/decode/decode_test.go:
      because DecodeValue and DecodeResponse accept json.RawMessage (now sourced from goccy/go-json),
      any test helper that constructs json.RawMessage via encoding/json must switch its import to
      github.com/goccy/go-json to avoid a package-boundary type mismatch.
    status: pending
    dependencies:
      - task-003
    acceptance_criteria:
      - "query.go imports github.com/goccy/go-json and not encoding/json"
      - "internal/api/api.go imports github.com/goccy/go-json and not encoding/json"
      - "internal/decode/decode.go imports github.com/goccy/go-json and not encoding/json"
      - "internal/decode/decode_test.go imports github.com/goccy/go-json (not encoding/json) wherever json.RawMessage is constructed"
      - "No logic, error messages, or struct definitions are changed in any of the above files"
    completed_at: null

