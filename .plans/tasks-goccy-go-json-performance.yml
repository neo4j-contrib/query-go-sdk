tasks:
  - id: task-001
    title: "Add BenchmarkDecodeResponse to decode_test.go (baseline)"
    description: |
      Add a BenchmarkDecodeResponse function to internal/decode/decode_test.go while the
      package still uses encoding/json, so the baseline numbers can be captured before the
      library swap. The benchmark must synthesise a 1 000-row × 10-column wireResponse JSON
      payload where every cell is a typed envelope ({"$type":"String","_value":"hello"}) and
      call DecodeResponse on it in a b.N loop, reporting ns/op, B/op, and allocs/op.
    status: completed
    dependencies: []
    acceptance_criteria:
      - "BenchmarkDecodeResponse exists in internal/decode/decode_test.go"
      - "The benchmark payload contains exactly 1 000 rows and 10 columns of typed envelopes"
      - "go test -bench=BenchmarkDecodeResponse ./internal/decode/ runs to completion and prints ns/op, B/op, allocs/op"
      - "No existing tests in decode_test.go are modified or broken"
    completed_at: "2026-06-09T00:00:00Z"

  - id: task-002
    title: "Capture baseline benchmark numbers (encoding/json)"
    description: |
      Run the benchmark suite with encoding/json still in place and save the output to
      .plans/bench-before.txt. This covers BenchmarkDecodeResponse (added in task-001) and
      the existing BenchmarkQueryService_Execute_Sequential and BenchmarkQueryService_Execute_Parallel
      in context_test.go. The file will be used to produce the before/after table in the PR description.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - ".plans/bench-before.txt exists and is non-empty"
      - "bench-before.txt contains BenchmarkDecodeResponse results with ns/op, B/op, allocs/op columns"
      - "bench-before.txt contains BenchmarkQueryService_Execute_Sequential results"
    completed_at: "2026-06-09T00:00:00Z"

